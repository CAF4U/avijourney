name: avijourney
description: CAF4U Aircraft Companion - live aviation around you, a CAF4U Companion.
publish_to: "none"

version: 0.3.3+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: 7.0.2
  geolocator: 10.1.1
  geolocator_android: 4.5.5
  http: ^1.6.0
  latlong2: 0.9.1
  shared_preferences: ^2.5.3
  url_launcher: 6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/data/global_airports.tsv
    - assets/data/global_airlines.tsv
